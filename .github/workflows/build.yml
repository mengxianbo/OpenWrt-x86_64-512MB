name: 编译 OpenWrt x86_64 512MB

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt 源码版本
        required: true
        default: v24.10.3
      clean_build:
        description: 清理编译缓存
        type: boolean
        required: true
        default: false
      publish_release:
        description: 编译成功后发布到 Releases
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: openwrt-x86-64-512mb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 x86_64 固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version || 'v24.10.3' }}
      ROOTFS_PARTSIZE: "512"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib             g++-multilib gettext git libncurses-dev libssl-dev             python3 python3-setuptools rsync swig unzip zlib1g-dev             file wget curl ccache xsltproc libelf-dev device-tree-compiler             ecj fastjar java-propose-classpath
          sudo timedatectl set-timezone UTC

      - name: 检出 OpenWrt 官方源码
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$OPENWRT_VERSION"             https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPENWRT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: 配置软件源与集成 OpenRung
        run: |
          set -euxo pipefail
          cd openwrt

          # Passwall 固定到 25.4.1 对应的上游提交，避免跟随 main 自动升级。
          PASSWALL_LUCI_COMMIT="0799261a542e55bb4bbf6dac85803e22e344f7a2"
          PASSWALL_PACKAGES_COMMIT="cd668cd468db68a6e5aad6d32f19ff7bd73a59e2"

          cat >> feeds.conf.default <<'EOF'
          src-git kenzo https://github.com/kenzok8/openwrt-packages.git
          src-git small https://github.com/kenzok8/small.git
          EOF

          ./scripts/feeds update -a

          # 清理其他 feed 中与 Passwall 专用依赖重复的旧包。
          for pkg in chinadns-ng dns2socks geoview hysteria ipt2socks microsocks naiveproxy shadowsocks-libev shadowsocks-rust shadowsocksr-libev simple-obfs sing-box tcping trojan-plus tuic-client v2ray-geodata v2ray-plugin xray-core xray-plugin; do
            rm -rf "feeds/packages/net/$pkg"
          done
          rm -rf feeds/luci/applications/luci-app-passwall
          ./scripts/feeds install -a

          # OpenWrt 24.10.3 自带 Go 1.23.12；kenzo feed 的 ddns-go 6.18.0
          # 已要求 Go 1.26，无法在该工具链下编译。固定到仍兼容 Go 1.23 的上游 v6.12.0，
          # 保留 DDNS-GO 功能，不移除软件包，也不改变 LuCI/系统其他功能。
          python3 - <<'PY'
          from pathlib import Path
          import re

          makefile = Path("feeds/kenzo/ddns-go/Makefile")
          if not makefile.is_file():
              raise SystemExit("错误：未找到 feeds/kenzo/ddns-go/Makefile")
          content = makefile.read_text()
          start = content.find("PKG_VERSION:=")
          end = content.find("PKG_LICENSE_FILES:=", start)
          if start < 0 or end < 0:
              raise SystemExit("错误：DDNS-GO Makefile 结构与预期不符，停止构建")
          pinned = """PKG_VERSION:=6.12.0
          PKG_RELEASE:=1
          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/jeessy2/ddns-go
          PKG_SOURCE_VERSION:=9ad1065a72799cbaab51aaa811edde1c37af9264
          PKG_SOURCE_SUBDIR:=$(PKG_NAME)-$(PKG_VERSION)

          """
          content = content[:start] + pinned + content[end:]
          makefile.write_text(content)
          print("DDNS-GO pinned: v6.12.0 (Go 1.23.6 compatible)")

          # small feed 的 MosDNS v5.3.4 依赖了高于 OpenWrt 24.10.3
          # 自带 Go 1.23.12 的工具链。固定到上游 v5.3.3（Go 1.22），
          # 保留 MosDNS 功能与原有包安装定义。
          makefile = Path("feeds/small/mosdns/Makefile")
          if not makefile.is_file():
              raise SystemExit("错误：未找到 feeds/small/mosdns/Makefile")
          content = makefile.read_text()
          start = content.find("PKG_VERSION:=")
          end = content.find("PKG_LICENSE:=", start)
          if start < 0 or end < 0:
              raise SystemExit("错误：MosDNS Makefile 结构与预期不符，停止构建")
          pinned = """PKG_VERSION:=5.3.3
          PKG_RELEASE:=15
          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/IrineSistiana/mosdns
          PKG_SOURCE_VERSION:=025823c1a5c9753c0e35f8b444b9e3c4472d37d1
          PKG_SOURCE_SUBDIR:=$(PKG_NAME)-$(PKG_VERSION)

          """
          content = content[:start] + pinned + content[end:]
          makefile.write_text(content)
          print("MosDNS pinned: v5.3.3 (Go 1.22 compatible)")

          # small feed 的 100-mosdns-update-dependencies.patch 是针对更新后的
          # MosDNS 源码编写，会把 go.mod 强制升级到 Go 1.26，并且与 v5.3.3
          # 的文件内容不匹配。仅跳过这个依赖升级补丁；保留其余功能补丁。
          dependency_patch = Path("feeds/small/mosdns/patches/100-mosdns-update-dependencies.patch")
          if dependency_patch.exists():
              dependency_patch.unlink()
              print("Skipped incompatible Go 1.26 dependency patch; kept other MosDNS patches")
          PY

          # 删除第三方 feed 安装的同名链接，统一使用固定提交的上游源码。
          mkdir -p package/passwall-packages package/passwall-luci
          for pkg in luci-app-passwall chinadns-ng dns2socks geoview hysteria ipt2socks microsocks naiveproxy shadowsocks-libev shadowsocks-rust shadowsocksr-libev simple-obfs sing-box tcping trojan-plus tuic-client v2ray-geodata v2ray-plugin xray-core xray-plugin; do
            find package/feeds -type l -name "$pkg" -delete 2>/dev/null || true
          done

          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git -C package/passwall-packages checkout "$PASSWALL_PACKAGES_COMMIT"
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
          git -C package/passwall-luci checkout "$PASSWALL_LUCI_COMMIT"

          echo "PASSWALL_VERSION=25.4.1" >> "$GITHUB_ENV"
          echo "PASSWALL_LUCI_COMMIT=$PASSWALL_LUCI_COMMIT" >> "$GITHUB_ENV"
          echo "PASSWALL_PACKAGES_COMMIT=$PASSWALL_PACKAGES_COMMIT" >> "$GITHUB_ENV"

          # 将用户维护的 OpenRung LuCI 插件和客户端打包源码纳入工作区。
          git clone --depth 1 https://github.com/mengxianbo/openwrt-openrung.git /tmp/openwrt-openrung
          mkdir -p package/openwrt-openrung
          cp -a /tmp/openwrt-openrung/package/. package/openwrt-openrung/
          echo "OPENRUNG_COMMIT=$(git -C /tmp/openwrt-openrung rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 生成 x86_64 配置
        run: |
          set -euxo pipefail
          cd openwrt
          cp ../config/seed.config .config
          cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          EOF
          make defconfig

          # 必须启用的插件；不存在的配置项会在后续检查中暴露。
          grep -E 'CONFIG_PACKAGE_(luci-app-passwall|luci-app-adguardhome|luci-app-ddns-go|luci-app-mosdns|luci-app-wechatpush)=' .config || true
          cp .config ../config/build.config

      - name: 核验 Passwall 版本与源码提交
        run: |
          set -euxo pipefail
          cd openwrt
          MAKEFILE="package/passwall-luci/luci-app-passwall/Makefile"
          test -f "$MAKEFILE"
          grep -q '^PKG_VERSION:=25.4.1$' "$MAKEFILE" || {
            echo "::error::Passwall 版本不是 25.4.1，停止编译。"
            grep -E '^PKG_(NAME|VERSION|RELEASE):=' "$MAKEFILE" || true
            exit 1
          }
          test "$(git -C package/passwall-luci rev-parse HEAD)" = "0799261a542e55bb4bbf6dac85803e22e344f7a2"
          test "$(git -C package/passwall-packages rev-parse HEAD)" = "cd668cd468db68a6e5aad6d32f19ff7bd73a59e2"
          echo "Passwall LuCI version: 25.4.1"
          echo "Passwall LuCI commit: $(git -C package/passwall-luci rev-parse HEAD)"
          echo "Passwall packages commit: $(git -C package/passwall-packages rev-parse HEAD)"

      - name: 下载源码包
        run: |
          set -euxo pipefail
          cd openwrt
          make download -j8

      - name: 编译固件和软件包
        run: |
          set -euxo pipefail
          cd openwrt
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            make clean
          fi
          make -j$(nproc) || make -j1 V=s

      - name: 整理固件与校验文件
        run: |
          set -euxo pipefail
          mkdir -p release
          find openwrt/bin/targets/x86/64 -maxdepth 1 -type f             \( -name '*combined*.img.gz' -o -name '*rootfs*.tar.gz'             -o -name '*.vdi' -o -name '*.vmdk' -o -name '*.qcow2'             -o -name '*.manifest' -o -name 'sha256sums' \)             -exec cp -v {} release/ \;

          # 输出插件 IPK，方便单独安装/排查。
          find openwrt/bin/packages -type f             \( -name '*passwall*.ipk' -o -name '*adguardhome*.ipk'             -o -name '*ddns-go*.ipk' -o -name '*mosdns*.ipk'             -o -name '*serverchan*.ipk' -o -name '*wechatpush*.ipk' \)             -exec cp -v {} release/ \; || true

          test -n "$(find release -maxdepth 1 -type f -name '*.img.gz' -print -quit)"
          cat > release/BUILD-INFO.txt <<EOF
          OpenWrt version: $OPENWRT_VERSION
          OpenWrt commit: $OPENWRT_COMMIT
          OpenRung packaging commit: $OPENRUNG_COMMIT
          Target: x86_64 / generic
          Root filesystem partition target: 512 MB
          Passwall version: 25.4.1
          Passwall LuCI commit: $PASSWALL_LUCI_COMMIT
          Passwall packages commit: $PASSWALL_PACKAGES_COMMIT
          Included plugins: Passwall, AdGuardHome, OpenRung, DDNS-GO, MosDNS, WeChatPush
          Excluded: Lucky, WebRTC
          EOF
          (cd release && sha256sum * > SHA256SUMS)
          ls -lah release

      - name: 上传 Actions 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64-512MB
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: 自动发布 GitHub Releases
        if: ${{ (inputs.publish_release == true || github.event_name == 'push') && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ env.OPENWRT_VERSION }}-${{ github.run_number }}
          name: OpenWrt x86_64 512MB ${{ env.OPENWRT_VERSION }} #${{ github.run_number }}
          body: |
            ## OpenWrt x86_64 512MB 定制固件

            - OpenWrt：${{ env.OPENWRT_VERSION }}
            - 源码提交：${{ env.OPENWRT_COMMIT }}
            - OpenRung 打包源码：${{ env.OPENRUNG_COMMIT }}
            - 根文件系统分区规划：512MB
            - 插件：Passwall、AdGuardHome、OpenRung、DDNS-GO、MosDNS、WeChatPush
            - 排除：Lucky、WebRTC

            请下载后核对 SHA256SUMS。首次启动请通过控制台确认网卡与启动模式。
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
